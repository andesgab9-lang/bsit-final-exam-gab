<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#172554">
<title>BSIT POS & Inventory</title>
<style>
:root{--navy:#172554;--blue:#2563eb;--bg:#f3f6fb;--ink:#172033;--muted:#64748b;--line:#e5eaf2;--green:#16a34a;--red:#dc2626;--amber:#d97706}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--ink)}
button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-weight:650}.primary{background:var(--blue);color:white}.secondary{background:#eaf0ff;color:#1d4ed8}.danger{background:#fee2e2;color:#b91c1c}.ghost{background:#f1f5f9;color:#334155}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.login{width:min(420px,100%);background:white;border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 18px 50px #17255414}.brand-icon{width:48px;height:48px;border-radius:14px;background:#dbeafe;color:#1d4ed8;display:grid;place-items:center;font-size:24px}.login h1{font-size:24px;margin:16px 0 4px}.muted{color:var(--muted)}.field{display:grid;gap:6px;margin:14px 0}.field label{font-weight:650;font-size:13px}.field input,.field select,.search{width:100%;padding:12px;border:1px solid #d7dfeb;border-radius:10px;background:white;outline:none}.field input:focus,.field select:focus,.search:focus{border-color:var(--blue);box-shadow:0 0 0 3px #2563eb18}.hint{font-size:12px;color:var(--muted);margin-top:14px}
.app{display:none;min-height:100vh}.topbar{height:66px;background:var(--navy);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 max(16px,calc((100vw - 1180px)/2));position:sticky;top:0;z-index:5}.top-brand{font-weight:800;letter-spacing:.2px}.top-brand small{display:block;font-size:11px;color:#bfdbfe;font-weight:500}.user-area{display:flex;align-items:center;gap:10px;font-size:13px}.layout{max-width:1180px;margin:auto;padding:22px 16px 40px;display:grid;grid-template-columns:220px 1fr;gap:22px}.sidebar{background:white;border:1px solid var(--line);border-radius:16px;padding:12px;height:max-content;position:sticky;top:84px}.navbtn{width:100%;display:flex;gap:10px;align-items:center;text-align:left;background:transparent;color:#475569;margin:2px 0}.navbtn.active{background:#eaf0ff;color:#1d4ed8}.content{min-width:0}.pagehead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 18px}.pagehead h2{font-size:24px;margin:0}.pagehead p{margin:3px 0 0;color:var(--muted);font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat,.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:16px}.stat .label{font-size:12px;color:var(--muted)}.stat .value{font-size:25px;font-weight:800;margin-top:5px}.stat .sub{font-size:11px;color:var(--muted);margin-top:2px}.panel{margin-bottom:16px}.panel h3{font-size:16px;margin:0 0 14px}.toolbar{display:flex;gap:9px;align-items:center;justify-content:space-between;margin-bottom:12px}.toolbar .search{max-width:300px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:560px}th,td{padding:11px 9px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}th{color:#64748b;font-size:11px;text-transform:uppercase;letter-spacing:.04em}tr:last-child td{border-bottom:0}.pill{display:inline-block;border-radius:99px;padding:4px 8px;font-size:11px;font-weight:700;background:#dcfce7;color:#166534}.pill.low{background:#fef3c7;color:#92400e}.pill.out{background:#fee2e2;color:#991b1b}.actions{display:flex;gap:6px}.actions button{padding:6px 9px;font-size:12px}.empty{text-align:center;color:var(--muted);padding:28px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-row .field{margin:8px 0}.modal{position:fixed;inset:0;background:#0f172a88;display:none;place-items:center;padding:16px;z-index:10}.modal.show{display:grid}.modal-card{width:min(480px,100%);background:white;border-radius:18px;padding:20px;max-height:90vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head h3{margin:0}.close{background:#f1f5f9;padding:6px 10px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.notice{padding:10px 12px;border-radius:10px;background:#eff6ff;color:#1e40af;font-size:12px;margin:12px 0}.sale-line{display:grid;grid-template-columns:1fr 75px 80px 34px;gap:7px;align-items:center;margin:8px 0}.sale-line select,.sale-line input{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px}.total{font-size:22px;font-weight:800;text-align:right;padding:12px 0}.mobile-nav{display:none}
@media(max-width:760px){.topbar{height:60px;padding:0 14px}.layout{display:block;padding:14px 12px 86px}.sidebar{display:none}.stats{grid-template-columns:repeat(2,1fr);gap:9px}.stat{padding:13px}.stat .value{font-size:21px}.pagehead h2{font-size:21px}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);z-index:6;padding:7px 5px calc(7px + env(safe-area-inset-bottom));justify-content:space-around}.mobile-nav .navbtn{width:auto;display:grid;justify-items:center;gap:2px;font-size:10px;padding:6px 8px;margin:0}.mobile-nav .navbtn span:first-child{font-size:18px}.user-area .user-label{display:none}.grid2{grid-template-columns:1fr}.toolbar{align-items:stretch;flex-direction:column}.toolbar .search{max-width:none}.form-row{grid-template-columns:1fr 1fr}.top-brand{font-size:14px}}
@media(max-width:380px){.form-row{grid-template-columns:1fr}.stats{gap:7px}.stat .value{font-size:19px}}
</style>
</head>
<body>
<div id="loginScreen" class="login-wrap">
  <form class="login" id="loginForm">
    <div class="brand-icon">▦</div>
    <h1>POS & Inventory</h1>
    <div class="muted">BSIT Final Project</div>
    <div class="field"><label>Username</label><input id="username" autocomplete="username" required value="admin"></div>
    <div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required value="admin123"></div>
    <button class="primary" style="width:100%;margin-top:6px">Log in</button>
    <div class="hint">Demo account: <b>admin</b> / <b>admin123</b></div>
  </form>
</div>
<div id="app" class="app">
<header class="topbar"><div class="top-brand">▦ BSIT POS <small>Inventory Management System</small></div><div class="user-area"><span class="user-label">Signed in as <b>Admin</b></span><button class="ghost" id="logoutBtn">Log out</button></div></header>
<div class="layout">
<aside class="sidebar" id="sideNav"></aside>
<main class="content" id="mainContent"></main>
</div>
<nav class="mobile-nav" id="mobileNav"></nav>
</div>
<div class="modal" id="modal"><div class="modal-card" id="modalCard"></div></div>
<script>
const $=s=>document.querySelector(s), money=n=>'₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const defaultProducts=[
{id:1,name:'Notebook',sku:'ST-001',category:'School Supplies',price:35,cost:20,stock:50,min:10},
{id:2,name:'Ballpen',sku:'ST-002',category:'School Supplies',price:15,cost:7,stock:100,min:20},
{id:3,name:'Bond Paper (Short)',sku:'ST-003',category:'Paper',price:2,cost:1,stock:300,min:50},
{id:4,name:'Folder',sku:'ST-004',category:'School Supplies',price:12,cost:6,stock:8,min:10}
];
let products=JSON.parse(localStorage.getItem('pos_products')||'null')||defaultProducts;
let sales=JSON.parse(localStorage.getItem('pos_sales')||'[]');
let page='dashboard';
function save(){localStorage.setItem('pos_products',JSON.stringify(products));localStorage.setItem('pos_sales',JSON.stringify(sales))}
function nav(){const items=[['dashboard','▦','Dashboard'],['products','▤','Products'],['sales','＋','New Sale'],['transactions','▣','Transactions'],['reports','▥','Reports']];const html=items.map(([id,ic,label])=>`<button class="navbtn ${page===id?'active':''}" data-page="${id}"><span>${ic}</span><span>${label}</span></button>`).join('');$('#sideNav').innerHTML=html;$('#mobileNav').innerHTML=html;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()})}
function header(title,sub,action=''){return `<div class="pagehead"><div><h2>${title}</h2><p>${sub}</p></div>${action}</div>`}
function stat(label,value,sub){return `<div class="stat"><div class="label">${label}</div><div class="value">${value}</div><div class="sub">${sub}</div></div>`}
function dashboard(){let revenue=sales.reduce((a,s)=>a+s.total,0),units=products.reduce((a,p)=>a+p.stock,0),low=products.filter(p=>p.stock<=p.min).length;return header('Dashboard','Overview of your store')+`<div class="stats">${stat('Total Products',products.length,'Items in catalog')}${stat('Stock on Hand',units,'Total units')}${stat('Sales Transactions',sales.length,'Completed sales')}${stat('Total Revenue',money(revenue),'All recorded sales')}</div><div class="grid2"><section class="panel"><h3>Low Stock Alert</h3>${low?products.filter(p=>p.stock<=p.min).map(p=>`<p style="display:flex;justify-content:space-between;gap:8px"><b>${esc(p.name)}</b><span class="pill ${p.stock===0?'out':'low'}">${p.stock} left</span></p>`).join(''):'<div class="empty">All products have sufficient stock.</div>'}</section><section class="panel"><h3>Recent Transactions</h3>${sales.length? sales.slice(-5).reverse().map(s=>`<p style="display:flex;justify-content:space-between;gap:8px"><span>${s.id}<br><small class="muted">${new Date(s.date).toLocaleString()}</small></span><b>${money(s.total)}</b></p>`).join(''):'<div class="empty">No sales recorded yet.</div>'}</section></div><section class="panel"><h3>Quick Actions</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="primary" onclick="page='sales';render()">＋ Create Sale</button><button class="secondary" onclick="openProduct()">＋ Add Product</button></div></section>`}
function productsPage(){return header('Products','Manage product details and stock',`<button class="primary" onclick="openProduct()">＋ Add Product</button>`)+`<section class="panel"><div class="toolbar"><input class="search" id="productSearch" placeholder="Search product or SKU..."><span class="muted">${products.length} products</span></div><div class="table-wrap"><table><thead><tr><th>Product</th><th>SKU</th><th>Price</th><th>Stock</th><th>Status</th><th>Actions</th></tr></thead><tbody id="productRows">${productRows(products)}</tbody></table></div></section>`}
function productRows(list){return list.length?list.map(p=>`<tr><td><b>${esc(p.name)}</b><br><small class="muted">${esc(p.category)}</small></td><td>${esc(p.sku)}</td><td>${money(p.price)}</td><td>${p.stock}</td><td><span class="pill ${p.stock===0?'out':p.stock<=p.min?'low':''}">${p.stock===0?'Out of stock':p.stock<=p.min?'Low stock':'In stock'}</span></td><td><div class="actions"><button class="secondary" onclick="openProduct(${p.id})">Edit</button><button class="danger" onclick="deleteProduct(${p.id})">Delete</button></div></td></tr>`).join(''):'<tr><td colspan="6" class="empty">No products found.</td></tr>'}
function transactions(){return header('Transactions','History of completed sales')+`<section class="panel"><div class="table-wrap"><table><thead><tr><th>Receipt No.</th><th>Date</th><th>Items</th><th>Total</th></tr></thead><tbody>${sales.length?sales.slice().reverse().map(s=>`<tr><td><b>${s.id}</b></td><td>${new Date(s.date).toLocaleString()}</td><td>${s.items.reduce((n,i)=>n+i.qty,0)}</td><td><b>${money(s.total)}</b></td></tr>`).join(''):'<tr><td colspan="4" class="empty">No transactions yet.</td></tr>'}</tbody></table></div></section>`}
function reports(){let rev=sales.reduce((a,s)=>a+s.total,0),cost=sales.reduce((a,s)=>a+s.items.reduce((n,i)=>n+i.cost*i.qty,0),0);return header('Reports','Sales and inventory summary')+`<div class="stats">${stat('Gross Sales',money(rev),'Recorded revenue')}${stat('Estimated Profit',money(rev-cost),'Sales minus item cost')}${stat('Products',products.length,'Catalog items')}${stat('Low Stock',products.filter(p=>p.stock<=p.min).length,'Need restocking')}</div><section class="panel"><h3>Inventory Summary</h3><div class="table-wrap"><table><thead><tr><th>Product</th><th>Stock</th><th>Unit Cost</th><th>Stock Value</th></tr></thead><tbody>${products.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.stock}</td><td>${money(p.cost)}</td><td>${money(p.cost*p.stock)}</td></tr>`).join('')}</tbody></table></div></section>`}
let cart=[];
function salesPage(){return header('New Sale','Select products and record a customer purchase')+`<section class="panel"><h3>Sale Items</h3><div id="cartLines"></div><button class="secondary" onclick="addCartLine()">＋ Add Item</button><div class="total" id="cartTotal">Total: ${money(0)}</div><button class="primary" style="width:100%" onclick="completeSale()">Complete Sale</button><div class="hint">Stock quantities are deducted automatically after a sale is completed.</div></section>`}
function render(){nav();let html=({dashboard,products:productsPage,sales:salesPage,transactions,reports}[page]||dashboard)();$('#mainContent').innerHTML=html;if(page==='products'){$('#productSearch').oninput=e=>$('#productRows').innerHTML=productRows(products.filter(p=>(p.name+' '+p.sku+' '+p.category).toLowerCase().includes(e.target.value.toLowerCase())))}if(page==='sales'){if(!cart.length)addCartLine();drawCart()}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showModal(content){$('#modalCard').innerHTML=content;$('#modal').classList.add('show')}
function closeModal(){$('#modal').classList.remove('show')}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()}
function openProduct(id){let p=products.find(x=>x.id===id)||{name:'',sku:'',category:'General',price:'',cost:'',stock:0,min:5};showModal(`<div class="modal-head"><h3>${id?'Edit Product':'Add Product'}</h3><button class="close" onclick="closeModal()">✕</button></div><form id="productForm"><div class="field"><label>Product Name</label><input name="name" required value="${esc(p.name)}"></div><div class="form-row"><div class="field"><label>SKU</label><input name="sku" required value="${esc(p.sku)}"></div><div class="field"><label>Category</label><input name="category" value="${esc(p.category)}"></div><div class="field"><label>Selling Price (₱)</label><input name="price" type="number" min="0" step=".01" required value="${p.price}"></div><div class="field"><label>Unit Cost (₱)</label><input name="cost" type="number" min="0" step=".01" required value="${p.cost}"></div><div class="field"><label>Stock Quantity</label><input name="stock" type="number" min="0" required value="${p.stock}"></div><div class="field"><label>Low Stock Level</label><input name="min" type="number" min="0" required value="${p.min}"></div></div><div class="modal-actions"><button type="button" class="ghost" onclick="closeModal()">Cancel</button><button class="primary">Save Product</button></div></form>`);$('#productForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),data={name:f.get('name').trim(),sku:f.get('sku').trim(),category:f.get('category').trim()||'General',price:+f.get('price'),cost:+f.get('cost'),stock:+f.get('stock'),min:+f.get('min')};if(products.some(x=>x.sku.toLowerCase()===data.sku.toLowerCase()&&x.id!==id)){alert('SKU already exists. Please use a unique SKU.');return}if(id)Object.assign(p,data);else products.push({id:Date.now(),...data});save();closeModal();render()}}
function deleteProduct(id){let p=products.find(x=>x.id===id);if(confirm(`Delete ${p.name}?`)){products=products.filter(x=>x.id!==id);save();render()}}
function addCartLine(){if(!products.some(p=>p.stock>0)){alert('No available stock. Add products first.');return}cart.push({pid:products.find(p=>p.stock>0).id,qty:1});drawCart()}
function drawCart(){let el=$('#cartLines');if(!el)return;el.innerHTML=cart.map((c,i)=>{let p=products.find(x=>x.id===c.pid);return `<div class="sale-line"><select onchange="cart[${i}].pid=+this.value;drawCart()">${products.filter(x=>x.stock>0||x.id===c.pid).map(x=>`<option value="${x.id}" ${x.id===c.pid?'selected':''}>${esc(x.name)} (${x.stock})</option>`).join('')}</select><input type="number" min="1" max="${p.stock}" value="${c.qty}" onchange="cart[${i}].qty=Math.max(1,Math.min(+this.value,${p.stock}));drawCart()"><b>${money(p.price*c.qty)}</b><button class="danger" style="padding:5px" onclick="cart.splice(${i},1);drawCart()">×</button></div>`}).join('')||'<div class="empty">Add an item to start a sale.</div>';$('#cartTotal').textContent='Total: '+money(cart.reduce((n,c)=>n+products.find(p=>p.id===c.pid).price*c.qty,0))}
function completeSale(){if(!cart.length){alert('Please add at least one item.');return}for(let c of cart){let p=products.find(x=>x.id===c.pid);if(!p||c.qty<1||c.qty>p.stock){alert('Please check item quantities and available stock.');return}}let items=cart.map(c=>{let p=products.find(x=>x.id===c.pid);return {name:p.name,qty:c.qty,price:p.price,cost:p.cost}}),total=items.reduce((n,i)=>n+i.qty*i.price,0);cart.forEach(c=>products.find(p=>p.id===c.pid).stock-=c.qty);sales.push({id:'OR-'+Date.now().toString().slice(-8),date:new Date().toISOString(),items,total});save();cart=[];alert('Sale completed! Total: '+money(total));page='transactions';render()}
$('#loginForm').onsubmit=e=>{e.preventDefault();if($('#username').value==='admin'&&$('#password').value==='admin123'){$('#loginScreen').style.display='none';$('#app').style.display='block';render()}else alert('Incorrect username or password.')};
$('#logoutBtn').onclick=()=>{if(confirm('Log out now?')){$('#app').style.display='none';$('#loginScreen').style.display='grid'}};
</script>
</body>
</html>
